name: Daily housing lottery alerts

on:
  schedule:
    # GitHub starts scheduled jobs late (observed: up to ~4 hours), so this is set early on
    # purpose. 13:17 UTC = 6:17am Pacific / 9:17am Eastern in daylight time (5:17am Pacific in winter).
    - cron: "17 13 * * *"
  workflow_dispatch: {}      # lets you run it by hand from the Actions tab

permissions:
  contents: write            # so the job can save seen.json

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run alerts
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}   # your filters, incl. income; never committed
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python lottery_alerts.py
      - name: Save seen lotteries
        run: |
          git config user.name "lottery-bot"
          git config user.email "lottery-bot@users.noreply.github.com"
          git add seen.json || true
          git diff --cached --quiet || (git commit -m "Update seen lotteries" && git push)
      # Re-rental pages from HPD's list. Runs even if the lottery step above had a problem.
      # Yesterday's page text lives in a private Actions cache, not in the (public) repo.
      - name: Restore re-rental snapshots
        if: always()
        uses: actions/cache/restore@v4
        with:
          path: .rerental_cache
          key: rerentals-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: rerentals-
      - name: Check re-rental pages
        if: always()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python rerental_watch.py
      - name: Save re-rental snapshots
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .rerental_cache
          key: rerentals-${{ github.run_id }}-${{ github.run_attempt }}
