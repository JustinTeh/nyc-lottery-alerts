name: Daily housing lottery alerts

on:
  schedule:
    - cron: "17 15 * * *"   # every day around 8:17am Pacific / 11:17am Eastern
  workflow_dispatch: {}      # lets you run it by hand from the Actions tab

permissions:
  contents: write            # so the job can save seen.json

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run alerts
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}   # your filters, incl. income; never committed
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python lottery_alerts.py
      - name: Save seen lotteries
        run: |
          git config user.name "lottery-bot"
          git config user.email "lottery-bot@users.noreply.github.com"
          git add seen.json || true
          git diff --cached --quiet || (git commit -m "Update seen lotteries" && git push)
